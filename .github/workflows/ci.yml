name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: フォーマット確認
        run: npm run format:check
      - name: 単体テストと網羅率
        run: npm run test:coverage
      - name: ビルド
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: E2E テスト（スマートフォン幅と PC 幅）
        run: npm run test:e2e -- --project=mobile --project=desktop --output=test-results/functional
      - name: 性能の計測（直列）
        run: npm run test:e2e -- --project=performance --workers=1 --output=test-results/performance
      - name: 計測と検査の記録を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
